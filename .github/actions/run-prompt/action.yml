name: Run Kimi Code Prompt
description: Run a versioned prompt from the central auto-dev repository

inputs:
  name:
    description: Prompt basename without .md (plan-issue, plan-doc, develop, review, fix)
    required: true

runs:
  using: composite
  steps:
    - name: Execute prompt
      shell: bash
      run: |
        prompt_dir="${{ github.action_path }}/../../prompts"
        name="${{ inputs.name }}"
        {
          case "$name" in
            develop|fix|review)
              cat "$prompt_dir/agent-contract.md"
              printf '\n---\n\n'
              ;;
          esac
          cat "$prompt_dir/$name.md"
        } > /tmp/auto-dev-prompt.md
        kimi -p "$(cat /tmp/auto-dev-prompt.md)"
