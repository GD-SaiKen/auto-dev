name: auto-dev plan

on:
  workflow_call:
    inputs:
      issue_number:
        required: false
        type: string
        default: ''
      before_sha:
        required: false
        type: string
        default: ''
      after_sha:
        required: false
        type: string
        default: ''
    secrets:
      LLM_API_KEY:
        required: true

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: auto-dev-plan-${{ inputs.issue_number || inputs.after_sha || github.run_id }}
  cancel-in-progress: true

env:
  GLOBALSINO_API_KEY: ${{ secrets.LLM_API_KEY }}
  LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://aikey.globalsino.com.cn' }}
  LLM_MODEL: ${{ vars.LLM_MODEL || 'deepseek-flash' }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  from-issue:
    if: inputs.issue_number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DSH_HOME: /tmp/dsh-home
      ISSUE_NUMBER: ${{ inputs.issue_number }}
    steps:
      - uses: actions/checkout@v4
      - name: 检查是否已有方案
        id: existing
        run: |
          found=$(gh issue view "$ISSUE_NUMBER" --json comments --jq '[.comments[] | select(.author.login == "github-actions" or .author.login == "github-actions[bot]") | .body | contains("<!-- auto-dev-plan -->")] | any')
          echo "found=$found" >> "$GITHUB_OUTPUT"
      - if: steps.existing.outputs.found != 'true'
        uses: GD-SaiKen/auto-dev/.github/actions/setup-dsh@main
        with:
          version: ${{ vars.DSH_VERSION || 'latest' }}
      - if: steps.existing.outputs.found != 'true'
        uses: GD-SaiKen/auto-dev/.github/actions/run-prompt@main
        with:
          name: plan-issue

  from-doc:
    if: inputs.before_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DSH_HOME: /tmp/dsh-home
      BEFORE_SHA: ${{ inputs.before_sha }}
      AFTER_SHA: ${{ inputs.after_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 找出新增或修改的方案文档
        id: files
        run: |
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            git ls-files 'proposals/*.md' > /tmp/auto-dev-all-proposals.txt
          else
            git diff --name-only --diff-filter=AM "$BEFORE_SHA" "$AFTER_SHA" -- 'proposals/*.md' > /tmp/auto-dev-all-proposals.txt
          fi
          grep -v '^proposals/README.md$' /tmp/auto-dev-all-proposals.txt > /tmp/auto-dev-proposals.txt || true
          if [ -s /tmp/auto-dev-proposals.txt ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo 'PROPOSAL_PATHS<<EOF'
              cat /tmp/auto-dev-proposals.txt
              echo EOF
            } >> "$GITHUB_ENV"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.files.outputs.changed == 'true'
        uses: GD-SaiKen/auto-dev/.github/actions/setup-dsh@main
        with:
          version: ${{ vars.DSH_VERSION || 'latest' }}
      - if: steps.files.outputs.changed == 'true'
        uses: GD-SaiKen/auto-dev/.github/actions/run-prompt@main
        with:
          name: plan-doc
      - name: 提醒转入 SDD（不自动开发）
        if: steps.files.outputs.changed == 'true'
        run: |
          if [ ! -s /tmp/auto-dev-created-issues.txt ]; then
            exit 0
          fi
          while read -r number; do
            if [ -n "$number" ]; then
              gh issue comment "$number" --body "$(cat <<'EOF'
`proposals` 已转成方案评论。请按 SDD 闭环继续（不全自动写代码）：

1. 开 PR 写 `docs/SDD/规格文档/<本期>.md` → `ci` + `auto-review`（规格评审）
2. 再开 PR 写 `docs/SDD/实施计划/<本期>.md` → `ci` + `auto-review`（计划评审，`plan-reviewed` 打标后）
3. Actions 手动运行 **auto-develop**（传本 Issue 号）

全程遵守 dev-standards（见中心仓 agent-contract）。
EOF
)"
            fi
          done < /tmp/auto-dev-created-issues.txt
