name: auto-dev review

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
    secrets:
      LLM_API_KEY:
        required: true

permissions:
  contents: read
  pull-requests: write
  actions: write

concurrency:
  group: auto-dev-review-${{ inputs.pr_number }}
  cancel-in-progress: true

env:
  GLOBALSINO_API_KEY: ${{ secrets.LLM_API_KEY }}
  LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://aikey.globalsino.com.cn' }}
  LLM_MODEL: ${{ vars.LLM_MODEL || 'deepseek-flash' }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DSH_HOME: /tmp/dsh-home
      PR_NUMBER: ${{ inputs.pr_number }}
    steps:
      - uses: actions/checkout@v4
      - name: 检查 PR 来源
        id: source
        run: |
          head_repo=$(gh pr view "$PR_NUMBER" --json headRepository --jq '.headRepository.nameWithOwner')
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Skip fork PR #$PR_NUMBER to protect model credentials."
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.source.outputs.allowed == 'true'
        uses: GD-SaiKen/auto-dev/.github/actions/setup-dsh@main
        with:
          version: ${{ vars.DSH_VERSION || 'latest' }}
      - if: steps.source.outputs.allowed == 'true'
        uses: GD-SaiKen/auto-dev/.github/actions/run-prompt@main
        with:
          name: review
      - name: 校验并提交结构化评审
        if: steps.source.outputs.allowed == 'true'
        run: |
          jq -e '
            (.verdict == "approve" or .verdict == "request_changes") and
            (.summary | type == "string") and
            (.findings | type == "array") and
            all(.findings[];
              (.severity == "critical" or .severity == "major" or .severity == "minor") and
              (.file | type == "string") and
              (.detail | type == "string")
            ) and
            ((.verdict != "approve") or all(.findings[]; .severity == "minor")) and
            ((.verdict != "request_changes") or any(.findings[]; .severity == "critical" or .severity == "major"))
          ' /tmp/auto-dev-review.json
          if [ "$(jq -r '.verdict' /tmp/auto-dev-review.json)" = "approve" ]; then
            event="APPROVE"
          else
            event="REQUEST_CHANGES"
          fi
          jq -r '
            (if .verdict == "approve" then "✅ AI 评审通过" else "❌ AI 评审未通过，请修复以下问题" end),
            "",
            .summary,
            "",
            (if (.findings | length) > 0 then
              "**问题清单**",
              (.findings[] | "- **\(.severity // "minor")** `\(.file // "未指定文件")` — \(.detail // "")")
            else empty end),
            "",
            "---",
            "🤖 由 DeepSeek Harness 自动评审"
          ' /tmp/auto-dev-review.json > /tmp/auto-dev-review.md
          jq -n --arg event "$event" --rawfile body /tmp/auto-dev-review.md '{event: $event, body: $body}' > /tmp/auto-dev-review-payload.json
          review_submitted=false
          if gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" --input /tmp/auto-dev-review-payload.json > /tmp/auto-dev-review-response.json 2> /tmp/auto-dev-review-api.err; then
            review_submitted=true
          else
            if grep -q "HTTP 422" /tmp/auto-dev-review-api.err || grep -q "Unprocessable Entity" /tmp/auto-dev-review-api.err; then
              gh pr comment "$PR_NUMBER" --body-file /tmp/auto-dev-review.md
              echo "Review API returned 422 (common when GITHUB_TOKEN opened this PR). Posted as comment instead."
            else
              cat /tmp/auto-dev-review-api.err
              exit 1
            fi
          fi
          head_sha=$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')
          head_ref=$(gh pr view "$PR_NUMBER" --json headRefName --jq '.headRefName')
          pr_files=$(gh pr diff "$PR_NUMBER" --name-only || true)
          sdd_spec=false
          sdd_plan=false
          if echo "$pr_files" | grep -q '^docs/SDD/规格文档/'; then sdd_spec=true; fi
          if echo "$pr_files" | grep -q '^docs/SDD/实施计划/'; then sdd_plan=true; fi
          issue_nums=$(gh pr view "$PR_NUMBER" --json closingIssuesReferences --jq -r '.closingIssuesReferences[].number // empty' | sort -u)
          if [ -z "$issue_nums" ]; then
            issue_nums=$(gh pr view "$PR_NUMBER" --json body,title --jq -r '[.body, .title] | join("\n")' | grep -oE '#[0-9]+' | tr -d '#' | sort -u)
          fi
          if [ "$event" = "APPROVE" ] && { [ "$sdd_spec" = true ] || [ "$sdd_plan" = true ]; }; then
            gh label create spec-reviewed --color 0E8A16 --description "SDD 规格评审通过" --force
            gh label create plan-reviewed --color 1D76DB --description "SDD 实施计划评审通过" --force
            for n in $issue_nums; do
              if [ "$sdd_spec" = true ]; then
                gh issue edit "$n" --add-label spec-reviewed || true
              fi
              if [ "$sdd_plan" = true ]; then
                gh issue edit "$n" --add-label plan-reviewed || true
              fi
            done
          fi
          if [[ "$head_ref" != auto/* ]]; then
            echo "Non-auto branch: SDD 或人工 PR，不自动合并；CI 失败请人工修复。"
            exit 0
          fi
          if [ "$event" = "APPROVE" ]; then
            if [ "$review_submitted" = "true" ]; then
              gh workflow run auto-merge.yml -f pr_number="$PR_NUMBER" -f expected_head_sha="$head_sha"
            else
              echo "Skipping auto-merge without formal APPROVED review (merge manually or use bot PAT on PR author)."
            fi
          else
            gh workflow run auto-fix.yml -f pr_number="$PR_NUMBER"
          fi
