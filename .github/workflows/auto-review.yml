name: auto-dev review

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
    secrets:
      LLM_API_KEY:
        required: true

permissions:
  contents: read
  pull-requests: write
  actions: write

concurrency:
  group: auto-dev-review-${{ inputs.pr_number }}
  cancel-in-progress: true

env:
  KIMI_MODEL_NAME: ${{ vars.LLM_MODEL || 'kimi-for-coding' }}
  KIMI_MODEL_API_KEY: ${{ secrets.LLM_API_KEY }}
  KIMI_MODEL_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.kimi.com/coding/v1' }}
  KIMI_CODE_TRUST_WORKSPACE: '1'
  KIMI_CODE_NO_AUTO_UPDATE: '1'
  KIMI_DISABLE_TELEMETRY: '1'
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PR_NUMBER: ${{ inputs.pr_number }}
    steps:
      - uses: actions/checkout@v4
      - name: 检查 PR 来源
        id: source
        run: |
          head_repo=$(gh pr view "$PR_NUMBER" --json headRepository --jq '.headRepository.nameWithOwner')
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Skip fork PR #$PR_NUMBER to protect model credentials."
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.source.outputs.allowed == 'true'
        uses: ./.github/actions/setup-kimi
        with:
          version: ${{ vars.KIMI_CLI_VERSION || 'latest' }}
      - if: steps.source.outputs.allowed == 'true'
        uses: ./.github/actions/run-prompt
        with:
          name: review
      - name: 校验并提交结构化评审
        if: steps.source.outputs.allowed == 'true'
        run: |
          jq -e '
            (.verdict == "approve" or .verdict == "request_changes") and
            (.summary | type == "string") and
            (.findings | type == "array") and
            all(.findings[];
              (.severity == "critical" or .severity == "major" or .severity == "minor") and
              (.file | type == "string") and
              (.detail | type == "string")
            ) and
            ((.verdict != "approve") or all(.findings[]; .severity == "minor")) and
            ((.verdict != "request_changes") or any(.findings[]; .severity == "critical" or .severity == "major"))
          ' /tmp/auto-dev-review.json
          if [ "$(jq -r '.verdict' /tmp/auto-dev-review.json)" = "approve" ]; then
            event="APPROVE"
          else
            event="REQUEST_CHANGES"
          fi
          jq -r '
            (if .verdict == "approve" then "✅ AI 评审通过" else "❌ AI 评审未通过，请修复以下问题" end),
            "",
            .summary,
            "",
            (if (.findings | length) > 0 then
              "**问题清单**",
              (.findings[] | "- **\(.severity // "minor")** `\(.file // "未指定文件")` — \(.detail // "")")
            else empty end),
            "",
            "---",
            "🤖 由 Kimi Code 自动评审"
          ' /tmp/auto-dev-review.json > /tmp/auto-dev-review.md
          jq -n --arg event "$event" --rawfile body /tmp/auto-dev-review.md '{event: $event, body: $body}' > /tmp/auto-dev-review-payload.json
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" --input /tmp/auto-dev-review-payload.json > /tmp/auto-dev-review-response.json
          head_sha=$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')
          head_ref=$(gh pr view "$PR_NUMBER" --json headRefName --jq '.headRefName')
          if [[ "$head_ref" != auto/* ]]; then
            echo "Non-auto branch: review submitted without automatic follow-up."
            exit 0
          fi
          if [ "$event" = "APPROVE" ]; then
            gh workflow run auto-merge.yml -f pr_number="$PR_NUMBER" -f expected_head_sha="$head_sha"
          else
            gh workflow run auto-fix.yml -f pr_number="$PR_NUMBER"
          fi
