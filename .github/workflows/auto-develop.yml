name: auto-dev develop

on:
  workflow_call:
    inputs:
      issue_number:
        required: true
        type: string
    secrets:
      LLM_API_KEY:
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: auto-dev-develop-${{ inputs.issue_number }}
  cancel-in-progress: false

env:
  KIMI_MODEL_NAME: ${{ vars.LLM_MODEL || 'kimi-for-coding' }}
  KIMI_MODEL_API_KEY: ${{ secrets.LLM_API_KEY }}
  KIMI_MODEL_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.kimi.com/coding/v1' }}
  KIMI_CODE_TRUST_WORKSPACE: '1'
  KIMI_CODE_NO_AUTO_UPDATE: '1'
  KIMI_DISABLE_TELEMETRY: '1'
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      BRANCH_NAME: auto/issue-${{ inputs.issue_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: GD-SaiKen/auto-dev/.github/actions/setup-kimi@main
        with:
          version: ${{ vars.KIMI_CLI_VERSION || 'latest' }}
      - name: 准备开发分支
        run: |
          git config user.name "auto-dev-bot"
          git config user.email "auto-dev-bot@users.noreply.github.com"
          git fetch origin
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" > /dev/null 2>&1; then
            git checkout -B "$BRANCH_NAME" "origin/$BRANCH_NAME"
          else
            git checkout -B "$BRANCH_NAME" origin/main
          fi
      - uses: GD-SaiKen/auto-dev/.github/actions/run-prompt@main
        with:
          name: develop
      - name: 检测文件变更
        id: changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            gh issue comment "$ISSUE_NUMBER" --body "开发流程已执行，但没有检测到文件变更，未创建提交或 PR。"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: 阻止修改受保护目录
        if: steps.changes.outputs.changed == 'true'
        run: |
          protected=$(git diff --cached --name-only -- .github/)
          if [ -n "$protected" ]; then
            echo "Agent attempted to modify protected .github/ paths. Changes will not be committed."
            printf '%s\n' "$protected"
            exit 1
          fi
      - name: 提交并推送开发分支
        if: steps.changes.outputs.changed == 'true'
        run: |
          git commit -m "auto: implement issue #${ISSUE_NUMBER}"
          git push -u origin "$BRANCH_NAME"
      - name: 创建或更新 PR
        id: pr
        if: steps.changes.outputs.changed == 'true'
        run: |
          if [ ! -s /tmp/auto-dev-summary.md ]; then
            echo "Kimi Code 已按方案完成开发，详细过程请查看 Actions 日志。" > /tmp/auto-dev-summary.md
          fi
          hold=false
          if [ -f /tmp/auto-dev-summary.md ] && grep -q '<!-- auto-dev-hold -->' /tmp/auto-dev-summary.md; then
            hold=true
          fi
          echo "hold=$hold" >> "$GITHUB_OUTPUT"
          pr_number=$(gh pr list --head "$BRANCH_NAME" --json number --jq '.[0].number // empty')
          if [ -n "$pr_number" ]; then
            {
              echo "已更新实现。"
              echo
              echo "## 最新实现摘要"
              cat /tmp/auto-dev-summary.md
            } > /tmp/auto-dev-pr-update.md
            gh pr comment "$pr_number" --body-file /tmp/auto-dev-pr-update.md
            if [ "$hold" = true ]; then
              gh pr ready "$pr_number" --undo || true
            else
              gh pr ready "$pr_number" || true
            fi
            pr_url=$(gh pr view "$pr_number" --json url --jq '.url')
          else
            issue_title=$(gh issue view "$ISSUE_NUMBER" --json title --jq '.title')
            {
              echo "自动开发，对应 Issue #${ISSUE_NUMBER}"
              echo
              echo "Closes #${ISSUE_NUMBER}"
              echo
              echo "## 实现摘要"
              cat /tmp/auto-dev-summary.md
              echo
              echo "---"
              echo "🤖 由 Kimi Code 自动开发"
            } > /tmp/auto-dev-pr-body.md
            if [ "$hold" = true ]; then
              pr_url=$(gh pr create --draft --title "auto: ${issue_title} (#${ISSUE_NUMBER})" --body-file /tmp/auto-dev-pr-body.md)
            else
              pr_url=$(gh pr create --title "auto: ${issue_title} (#${ISSUE_NUMBER})" --body-file /tmp/auto-dev-pr-body.md)
            fi
            pr_number=$(gh pr list --head "$BRANCH_NAME" --json number --jq '.[0].number')
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          if [ "$hold" = true ]; then
            gh issue comment "$ISSUE_NUMBER" --body "改动面较大，已开草稿 PR，确认后再转为可合并：${pr_url}"
          else
            gh issue comment "$ISSUE_NUMBER" --body "开发完成，PR：${pr_url}"
          fi
      - name: 显式调度自动评审
        if: steps.changes.outputs.changed == 'true' && steps.pr.outputs.hold != 'true'
        run: gh workflow run auto-review.yml -f pr_number="${{ steps.pr.outputs.number }}"
