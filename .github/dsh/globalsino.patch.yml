# CI overlay: third-party OpenAI-compatible provider (Globalsino) + default model.
# API key from env GLOBALSINO_API_KEY (mapped from business repo secret LLM_API_KEY).
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      globalsino:
        displayName: Globalsino
        apiKeyEnv: GLOBALSINO_API_KEY
        api: anthropic-messages
        baseURL: https://aikey.globalsino.com.cn
        models:
          - id: deepseek-flash
            name: deepseek-flash
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: globalsino
    model: deepseek-flash
- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true