name: auto-merge

on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      expected_head_sha:
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    uses: GD-SaiKen/auto-dev/.github/workflows/auto-merge.yml@main
    with:
      pr_number: ${{ inputs.pr_number }}
      expected_head_sha: ${{ inputs.expected_head_sha }}
