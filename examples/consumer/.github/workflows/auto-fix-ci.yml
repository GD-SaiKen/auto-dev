name: auto-fix-ci

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  actions: write
  pull-requests: read
  contents: read

jobs:
  dispatch:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      startsWith(github.event.workflow_run.head_branch, 'auto/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 查找对应 PR
        id: pr
        run: |
          branch="${{ github.event.workflow_run.head_branch }}"
          pr_number=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          if [ -z "$pr_number" ]; then
            echo "未找到分支 $branch 的开放 PR，跳过自动修复"
          fi
      - name: 调度 CI 自动修复
        if: steps.pr.outputs.number != ''
        run: |
          gh workflow run auto-fix.yml \
            -f pr_number="${{ steps.pr.outputs.number }}" \
            -f source=ci \
            -f ci_run_id="${{ github.event.workflow_run.id }}"
