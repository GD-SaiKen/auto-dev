name: auto-develop

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue 编号
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  develop:
    uses: GD-SaiKen/auto-dev/.github/workflows/auto-develop.yml@main
    with:
      issue_number: ${{ github.event_name == 'issues' && format('{0}', github.event.issue.number) || inputs.issue_number }}
    secrets:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
