name: auto-plan

on:
  push:
    branches: [main]
    paths:
      - "proposals/**"

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  from-doc:
    uses: GD-SaiKen/auto-dev/.github/workflows/auto-plan.yml@main
    with:
      before_sha: ${{ github.event.before }}
      after_sha: ${{ github.sha }}
    secrets:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
